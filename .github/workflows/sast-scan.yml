name: "sast-scan"

on:
  push:
    branches: [githubcicd]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: |
          npm ci --force

      - name: OWASP Dependency Check
        run: |
            LATEST_VERSION=$(curl -s https://api.github.com/repos/jeremylong/DependencyCheck/releases/latest | jq -r '.tag_name')
            wget https://github.com/jeremylong/DependencyCheck/releases/download/$LATEST_VERSION/dependency-check-$LATEST_VERSION-release.zip
            unzip dependency-check-$LATEST_VERSION-release.zip
  
            # Add SLF4J Simple Logger
            wget https://repo1.maven.org/maven2/org/slf4j/slf4j-simple/1.7.36/slf4j-simple-1.7.36.jar
            mv slf4j-simple-1.7.36.jar dependency-check/lib/

    #   - name: OWASP Dependency Check
    #     run: |
    #       wget https://github.com/jeremylong/DependencyCheck/releases/download/v7.2.0/dependency-check-7.2.0-release.zip
    #       unzip dependency-check-7.2.0-release.zip

      - name: Run scan with ODC
        run: |
          dependency-check/bin/dependency-check.sh --project "bitcoin" --scan . > ODC-report

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sast report
          path: |
            ./ODC-report
